openapi: 3.0.3
info:
  title: EduMotion Canonical REST API
  version: 1.0.0
  description: >
    Kontrak API publik backend-agnostic untuk EduMotion Web dan Mobile (Android/iOS).
    Semua respon error mengikuti amplop standar ErrorEnvelope.
    Tidak ada konvensi khusus framework backend/ORM yang mengikat frontend.
servers:
  - url: /api/v1
    description: Versioned API prefix v1
tags:
  - name: Auth
  - name: Journey
  - name: Learning
  - name: Questions
  - name: AI Generator
  - name: Assessment
  - name: Mastery & Gamification
  - name: School & Parent
  - name: Platform Admin
  - name: Ops

x-canonical-events:
  - QUESTION_VERSION_PUBLISHED
  - AI_GENERATION_RUN_COMPLETED
  - ACTIVITY_ATTEMPT_RECORDED
  - ACTIVITY_COMPLETED
  - COMPETENCY_MASTERY_UPDATED
  - JOURNEY_NODE_COMPLETED
  - JOURNEY_CHAPTER_COMPLETED
  - JOURNEY_TEMPLATE_UNLOCKED
  - JOURNEY_CHAPTER_STARTED
  - XP_AWARDED
  - ACHIEVEMENT_EARNED
  - ASSESSMENT_SUBMITTED
  - ASSESSMENT_GRADED
  - SUBSCRIPTION_ENTITLEMENT_CHANGED

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CorrelationIdHeader:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            fieldErrors:
              type: object
              additionalProperties:
                type: string
            correlationId:
              type: string

    PaginationMeta:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer

    AuthTokens:
      type: object
      required: [accessToken, refreshToken, expiresAt]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresAt:
          type: string
          format: date-time

    UserProfile:
      type: object
      required: [id, email, displayName, role, entitlement]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        initials:
          type: string
        role:
          type: string
        tenantId:
          type: string
          nullable: true
        educationLevel:
          type: string
        curriculumId:
          type: string
        gradeLevelId:
          type: string
        entitlement:
          type: string
        isMinor:
          type: boolean
        privacyOptInPublicName:
          type: boolean
        linkedStudentIds:
          type: array
          items:
            type: string
        assignedClassIds:
          type: array
          items:
            type: string

    JourneyTemplate:
      type: object
      required: [id, version, name, enabled]
      properties:
        id:
          type: string
          enum: [adventure, board, explore, skill, racing, galaxy]
        version:
          type: integer
        name:
          type: string
        enabled:
          type: boolean
        priorityWeight:
          type: integer
        unlocked:
          type: boolean
        eligible:
          type: boolean
        reasonCode:
          type: string
        reasonMessage:
          type: string

    JourneyPreferences:
      type: object
      required: [selectionMode]
      properties:
        selectionMode:
          type: string
          enum: [adaptive, personal, random, admin]
        preferredTemplateId:
          type: string
          nullable: true
        pendingTemplateId:
          type: string
          nullable: true
        unlocks:
          type: array
          items:
            type: object
            additionalProperties: true

    JourneyViewModel:
      type: object
      required: [schemaVersion, journeyId, pathId, chapter, template, accessibility, nodes]
      properties:
        schemaVersion:
          type: string
        journeyId:
          type: string
        pathId:
          type: string
        chapter:
          type: object
          additionalProperties: true
        template:
          type: object
          additionalProperties: true
        accessibility:
          type: object
          additionalProperties: true
        nodes:
          type: array
          items:
            type: object
            additionalProperties: true

    QuestionAuthoring:
      type: object
      required: [schemaVersion, id, version, type, metadata, content, interaction, answerSpec, scoring]
      properties:
        schemaVersion:
          type: string
          enum: [edumotion-question-v1]
        id:
          type: string
        version:
          type: integer
        type:
          type: string
          enum:
            - single_choice
            - multiple_select
            - true_false
            - numeric
            - short_text
            - fill_blank
            - matching
            - ordering
            - drag_drop
            - graph_plot
            - formula_input
            - diagram_label
            - simulation
            - worked_solution
        metadata:
          type: object
          additionalProperties: true
        content:
          type: object
          additionalProperties: true
        interaction:
          type: object
          additionalProperties: true
        answerSpec:
          type: object
          additionalProperties: true
        scoring:
          type: object
          additionalProperties: true
        explanation:
          type: object
          additionalProperties: true
        delivery:
          type: object
          additionalProperties: true
        accessibility:
          type: object
          additionalProperties: true
        governance:
          type: object
          additionalProperties: true

    QuestionStudentDelivery:
      type: object
      description: Allowlisted projection without answerSpec, scoring, provenance, or governance.
      required: [schemaVersion, questionId, version, type, content, interaction, delivery]
      properties:
        schemaVersion:
          type: string
        questionId:
          type: string
        version:
          type: integer
        type:
          type: string
        content:
          type: object
          additionalProperties: true
        interaction:
          type: object
          additionalProperties: true
        delivery:
          type: object
          additionalProperties: true
        accessibility:
          type: object
          additionalProperties: true

    AIGenerationRun:
      type: object
      required: [id, status, items]
      properties:
        id:
          type: string
        status:
          type: string
        estimatedCostUsd:
          type: number
        actualCostUsd:
          type: number
        budgetCapUsd:
          type: number
        maxRetries:
          type: integer
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        auditTrail:
          type: array
          items:
            type: object
            additionalProperties: true

    AssessmentSession:
      type: object
      required: [id, assessmentId, status, expiresAt, heartsEnabled, xpAffectsGrade, snapshots]
      properties:
        id:
          type: string
        assessmentId:
          type: string
        title:
          type: string
        mode:
          type: string
        status:
          type: string
        startedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        heartsEnabled:
          type: boolean
        xpAffectsGrade:
          type: boolean
        remainingSeconds:
          type: integer
        serverNowMs:
          type: integer
        snapshots:
          type: array
          items:
            type: object
            additionalProperties: true
        responses:
          type: object
          additionalProperties: true

    MediaAsset:
      type: object
      required: [id, fileName, mimeType, sizeBytes, storageKey, url]
      properties:
        id:
          type: string
        fileName:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
        storageKey:
          type: string
        url:
          type: string
        altText:
          type: string
        uploadedAt:
          type: string
          format: date-time

paths:
  /auth/demo-personas:
    get:
      tags: [Auth]
      summary: Daftar persona demo terdaftar (aktif hanya saat mode demo/non-produksi diizinkan)
      responses:
        '200':
          description: Daftar persona
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserProfile'

  /auth/session:
    get:
      tags: [Auth]
      summary: Memeriksa status sesi autentikasi saat ini via Bearer token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Status sesi

  /auth/login:
    post:
      tags: [Auth]
      summary: Autentikasi kredensial email dan kata sandi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Autentikasi berhasil
        '401':
          description: Kredensial tidak valid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: Validasi field gagal

  /auth/demo-login:
    post:
      tags: [Auth]
      summary: Masuk sebagai persona demo tertentu bila diizinkan environment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
      responses:
        '200': { description: Login demo berhasil }
        '403': { description: Demo login dinonaktifkan pada environment produksi }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotasi refresh token dan penerbitan access token baru
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200': { description: Token diperbarui }
        '401': { description: Refresh token tidak valid atau sudah dicabut }

  /auth/register:
    post:
      tags: [Auth]
      summary: Registrasi akun baru dan onboarding jenjang/kurikulum awal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, email, password]
              properties:
                displayName: { type: string }
                email: { type: string }
                password: { type: string }
                educationLevel: { type: string }
                curriculumId: { type: string }
      responses:
        '201': { description: Akun dibuat }
        '422': { description: Validasi gagal }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Meminta tautan reset kata sandi
      responses:
        '200': { description: Permintaan reset diproses }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Mengatur ulang kata sandi menggunakan token reset
      responses:
        '200': { description: Kata sandi diperbarui }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Mengakhiri sesi dan mencabut refresh token aktif
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Logout berhasil }

  /me/entitlements/upgrade:
    post:
      tags: [Auth]
      summary: Mengubah paket entitlement pengguna (audit & non-pay-to-win)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Entitlement diperbarui }

  /me/profile:
    patch:
      tags: [Auth]
      summary: Memperbarui profil dan preferensi privasi pengguna
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Profil diperbarui }

  /journey-templates:
    get:
      tags: [Journey]
      summary: Daftar katalog Journey template beserta status unlock per user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Daftar template
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/JourneyTemplate' }

  /me/journey/preferences:
    get:
      tags: [Journey]
      summary: Mengambil preferensi template & daftar unlock milik user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Preferensi Journey
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JourneyPreferences' }
    put:
      tags: [Journey]
      summary: Memperbarui mode pemilihan template untuk chapter berikutnya
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Preferensi diperbarui }

  /me/journey/preferences/pending-template:
    put:
      tags: [Journey]
      summary: Menyimpan pendingTemplateId tanpa mengubah snapshot chapter aktif
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Pending preference tersimpan }
        '403': { description: Template terkunci atau tidak memenuhi syarat }

  /me/journey/template-unlocks:
    get:
      tags: [Journey]
      summary: Daftar unlock template yang dimiliki siswa
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Daftar unlock }

  /journeys/{journeyId}/chapters/{chapterId}:
    get:
      tags: [Journey]
      summary: Detail chapter beserta canonical view model
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: journeyId, in: path, required: true, schema: { type: string } }
        - { name: chapterId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Detail chapter }

  /journeys/{journeyId}/chapters/{chapterId}/map:
    get:
      tags: [Journey]
      summary: Mengambil atau membuat snapshot canonical view model peta chapter
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: journeyId, in: path, required: true, schema: { type: string } }
        - { name: chapterId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Canonical view model chapter
          content:
            application/json:
              schema:
                type: object
                properties:
                  empty: { type: boolean }
                  viewModel: { $ref: '#/components/schemas/JourneyViewModel' }

  /journeys/{journeyId}/nodes/{nodeId}/start:
    post:
      tags: [Journey]
      summary: Memulai node setelah validasi prasyarat server-side
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: journeyId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Node dimulai }
        '409': { description: Prasyarat node belum terpenuhi }

  /journeys/{journeyId}/nodes/{nodeId}/complete:
    post:
      tags: [Journey]
      summary: Menyelesaikan node secara idempotent dan mencatat XP ledger + event outbox
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: journeyId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKeyHeader' }
      responses:
        '200': { description: Node selesai }

  /journeys/{journeyId}/chapters/next:
    post:
      tags: [Journey]
      summary: Membuka chapter berikutnya & membuat snapshot template immutable dalam 1 transaksi
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: journeyId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKeyHeader' }
      responses:
        '200': { description: Chapter baru dan snapshot terbuat }

  /journeys/chapters/{chapterId}/snapshot:
    put:
      tags: [Journey]
      summary: Endpoint penolakan eksplisit terhadap mutasi snapshot chapter aktif
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: chapterId, in: path, required: true, schema: { type: string } }
      responses:
        '409': { description: CHAPTER_TEMPLATE_IMMUTABLE }

  /question-taxonomies:
    get:
      tags: [Learning]
      summary: Katalog kurikulum, jenjang, mata pelajaran, topik, dan kompetensi kanonis
      responses:
        '200': { description: Taksonomi lengkap }

  /learning-paths:
    get:
      tags: [Learning]
      summary: Daftar learning paths & chapter terfilter
      responses:
        '200': { description: Daftar learning paths }

  /learning-paths/{pathId}:
    get:
      tags: [Learning]
      summary: Detail satu learning path
      parameters:
        - { name: pathId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Detail learning path }

  /learning-paths/{pathId}/chapters:
    get:
      tags: [Learning]
      summary: Daftar chapter dalam sebuah learning path
      parameters:
        - { name: pathId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Daftar chapter }

  /activities:
    get:
      tags: [Learning]
      summary: Daftar aktivitas latihan yang tersedia
      responses:
        '200': { description: Daftar aktivitas }

  /activities/{activityId}/delivery:
    get:
      tags: [Learning]
      summary: Payload aktivitas dan daftar QuestionStudentDelivery ter-sanitasi
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: activityId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Delivery aktivitas }

  /activities/{activityId}/attempts:
    post:
      tags: [Learning]
      summary: Mengumpulkan jawaban latihan, evaluasi server, update mastery & XP ledger
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: activityId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKeyHeader' }
      responses:
        '200': { description: Hasil evaluasi percobaan }

  /activities/{activityId}/attempts/{attemptId}:
    get:
      tags: [Learning]
      summary: Mengambil detail percobaan aktivitas
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: activityId, in: path, required: true, schema: { type: string } }
        - { name: attemptId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Detail percobaan }

  /questions/{questionId}/hints:
    get:
      tags: [Learning]
      summary: Mengambil hint bertahap untuk soal latihan
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: questionId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Teks hint }

  /activities/gallery:
    get:
      tags: [Learning]
      summary: Mengambil contoh 14 tipe soal interaktif untuk Galeri
      responses:
        '200': { description: Koleksi 14 tipe soal }

  /activities/gallery/{questionId}/grade:
    post:
      tags: [Learning]
      summary: Menilai interaksi soal preview di galeri
      parameters:
        - { name: questionId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Hasil preview }

  /questions:
    get:
      tags: [Questions]
      summary: Daftar soal di Bank Soal dengan isolasi tenant, filter, sort, & paginasi
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Daftar soal terpaginasi }
    post:
      tags: [Questions]
      summary: Membuat draf soal baru dengan skema authoring kanonis
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Draf soal tersimpan }

  /questions/validate:
    post:
      tags: [Questions]
      summary: Memvalidasi payload authoring soal secara deterministik
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Hasil validasi }

  /questions/preview:
    post:
      tags: [Questions]
      summary: Memproyeksikan payload authoring menjadi Student Delivery DTO tersanitasi
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: DTO preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionStudentDelivery' }

  /questions/{questionId}:
    get:
      tags: [Questions]
      summary: Mengambil detail authoring soal beserta riwayat versi
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: questionId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Detail soal }
    patch:
      tags: [Questions]
      summary: Memperbarui soal berstatus draft/validation_failed (published ditolak 409)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: questionId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Draf diperbarui }
        '409': { description: PUBLISHED_QUESTION_IMMUTABLE }

  /questions/{questionId}/validate:
    post:
      tags: [Questions]
      summary: Validasi soal tersimpan
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: questionId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Laporan validasi }

  /questions/{questionId}/preview:
    post:
      tags: [Questions]
      summary: Preview DTO siswa untuk soal tersimpan
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: questionId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: DTO siswa tersanitasi }

  /questions/{questionId}/submit-review:
    post:
      tags: [Questions]
      summary: Mengajukan draf valid ke antrean review SME
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: questionId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Status berubah menjadi in_review }

  /questions/{questionId}/reviews:
    post:
      tags: [Questions]
      summary: Keputusan SME (approve atau request_changes) + catatan review
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: questionId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Review tercatat }

  /questions/{questionId}/approve:
    post:
      tags: [Questions]
      summary: Persetujuan eksplisit soal in_review menuju approved
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: questionId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Soal disetujui }

  /questions/{questionId}/publish:
    post:
      tags: [Questions]
      summary: Menerbitkan versi soal approved menjadi published secara idempotent
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: questionId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKeyHeader' }
      responses:
        '200': { description: Soal diterbitkan }

  /questions/{questionId}/new-version:
    post:
      tags: [Questions]
      summary: Mengkloning versi published menjadi versi baru berstatus draft
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: questionId, in: path, required: true, schema: { type: string } }
      responses:
        '201': { description: Versi draft baru terbuat }

  /questions/{questionId}/archive:
    post:
      tags: [Questions]
      summary: Mengarsipkan versi soal
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: questionId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Soal diarsipkan }

  /question-media/presign:
    post:
      tags: [Questions]
      summary: Validasi keamanan & penerbitan metadata upload media soal (MIME, ukuran, dimensi, magic bytes)
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Aset media diterima
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAsset' }
        '413': { description: File terlalu besar }
        '415': { description: Tipe/magic bytes tidak didukung atau berbahaya }

  /ai/question-generation-stages:
    get:
      tags: [AI Generator]
      summary: Daftar 9 tahap pipeline AI Generator
      responses:
        '200': { description: Tahap pipeline }

  /ai/question-generation-runs:
    get:
      tags: [AI Generator]
      summary: Daftar riwayat AI generation runs milik tenant
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Daftar runs }
    post:
